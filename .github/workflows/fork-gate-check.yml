name: Fork check of the upstream gate

# Not part of any pull request. Runs the same jobs as ci.yml (the storytold gate with the same
# inputs, on Linux and on Windows as a `full-ci` pull request does) on a push to a `ci/` branch of a
# fork, where upstream's pull-request runs wait for a maintainer.
on:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

jobs:
  git-sources:
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows font notice regressions
        shell: pwsh
        run: ./packaging/windows/test-font-notices.ps1
      - name: Git dependencies come from storytold
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          # Source replacement, patches and path overrides in cargo config never show up
          # in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.
          # Cargo still reads the legacy .cargo/config.
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          # Fails when Cargo.lock is out of date with the manifests.
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")
                        and not p["source"].startswith("git+https://github.com/storytold/")})
          if bad:
              print("Git dependencies outside github.com/storytold:", *bad, sep="\n")
              sys.exit(1)
          PY

  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Windows on main, manual runs and pull requests labelled `full-ci`. No macOS on PRs or main:
      # the org's 5 macOS slots are kept for release builds, and release.yml builds macOS.
      os: '["ubuntu-24.04","windows-latest"]'
      # Same craft-fonts commit as release.yml and freebsd.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      # egui/winit/rfd, and the independent oracles (crates/oracle).
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      # cargo-deny for the deny step of `cargo xtask ci`, which requires it under CI.
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # A missing oracle fails the job instead of printing a skip notice that reads as a pass.
      linux-env: PDFCRAFT_ORACLES_REQUIRED=1
      windows-env: PDFCRAFT_REQUIRE_WINRES=1
      # Windows checks what differs by platform: the build (with resources) and the tests.
      windows-command: |
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked
